[project]
name = "pepewpew"
version = "0.1.0"
description = "Command line tool to fiddle with PE file properties"
requires-python = ">=3.9"
dependencies = [
  "pefile",
]

[project.scripts]
pepewpew = "pepewpew.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
